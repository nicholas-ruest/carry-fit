[package]
name = "carry-fit"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Exact constraint-aware packing-list optimizer"
license = "MIT"
repository = "https://github.com/nicholas-ruest/carry-fit"
readme = "README.md"
keywords = ["packing", "optimizer", "travel", "cli"]
categories = ["command-line-utilities", "algorithms"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.9"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.23"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
